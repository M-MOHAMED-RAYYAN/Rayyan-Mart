spring.application.name=online-shopping-system
server.port=${SERVER_PORT:8080}

# =====================================================
# DATABASE - H2 in SERVER (TCP) mode
# =====================================================
# The app connects to an externally started H2 TCP server:
#
#   java -cp h2-2.1.214.jar org.h2.tools.Server \
#        -tcp -tcpPort 9092 -tcpAllowOthers \
#        -baseDir /opt/rayyanmart/db -webAllowOthers
#
# The database file is created automatically on first connect
# (owner user/password comes from DB_USERNAME/DB_PASSWORD).
#
# To run with an embedded/in-memory H2 for LOCAL DEVELOPMENT only, set:
#   DB_URL=jdbc:h2:mem:shopping_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
# =====================================================
spring.datasource.url=${DB_URL:jdbc:h2:tcp://localhost:9092/rayyanmartdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
# Auto-detected from DB_URL by HikariCP when DB_DRIVER is not set (e.g. MySQL -> com.mysql.cj.jdbc.Driver)
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# =====================================================
# JPA / HIBERNATE
# Hibernate owns the schema (no schema.sql); data.sql seeds it.
# =====================================================
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# SEED DATA (data.sql) - run after Hibernate creates tables
# =====================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=true

# =====================================================
# OPTIONAL ADMIN BOOTSTRAP
# Set ADMIN_EMAIL and ADMIN_PASSWORD on startup to create
# an ADMIN account automatically (e.g. for local testing).
# =====================================================
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# =====================================================
# SESSION & COOKIES
# =====================================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never

# =====================================================
# SHOPPING ASSISTANT (AI CHATBOT)
# provider: mock (deterministic FAQ, works with no API key) | gemini
# The Gemini API key is read ONLY from the GEMINI_API_KEY environment variable.
# =====================================================
app.chat.enabled=${CHAT_ENABLED:true}
app.chat.provider=${CHAT_PROVIDER:mock}
app.chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:500}
app.chat.rate-limit.per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:10}
app.chat.cache.size=${CHAT_CACHE_SIZE:50}
app.chat.cache.ttl-seconds=${CHAT_CACHE_TTL_SECONDS:120}
app.chat.gemini.api-key=${GEMINI_API_KEY:}
app.chat.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.chat.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:8000}