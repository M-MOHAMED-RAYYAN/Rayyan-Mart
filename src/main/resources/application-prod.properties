spring.application.name=online-shopping-system
server.port=${PORT:${SERVER_PORT:10000}}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.continue-on-error=true
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}
server.error.include-stacktrace=never
app.chat.enabled=${CHAT_ENABLED:true}
app.chat.provider=${CHAT_PROVIDER:mock}
app.chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:500}
app.chat.rate-limit.per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:10}
app.chat.cache.size=${CHAT_CACHE_SIZE:50}
app.chat.cache.ttl-seconds=${CHAT_CACHE_TTL_SECONDS:120}
app.chat.gemini.api-key=${GEMINI_API_KEY:}
app.chat.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.chat.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:8000}