spring.datasource.url=jdbc:h2:mem:shopping_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Shopping assistant: use the deterministic provider in tests (no API key needed)
app.chat.enabled=true
app.chat.provider=mock
app.chat.max-message-length=50
app.chat.rate-limit.per-minute=10